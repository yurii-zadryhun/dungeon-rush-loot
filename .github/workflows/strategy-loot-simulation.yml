name: Strategy loot Monte Carlo

on:
  push:
    branches: [android-live]
    paths:
      - "tools/simulate_strategy_loot.py"
      - "tests/test_strategy_loot_simulation.py"
      - "tests/fixtures/strategy_start_equipment.json"
      - ".github/workflows/strategy-loot-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strategy-loot-simulation
  cancel-in-progress: true

jobs:
  simulate:
    name: EXP loot 50k per strategy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared dependencies
        run: python -m pip install "Pillow>=10,<13" "numpy>=1.26,<3" "rich>=13,<15"
      - name: Test generator and exact comparer parity
        run: python -m unittest discover -s tests -p 'test_strategy_loot_simulation.py' -v
      - name: Simulate identical 50k drops for PVP, PVE and Universal
        run: python -m tools.simulate_strategy_loot --iterations 50000 --seed 20261011 --output dist/strategy-simulation-50k
      - name: Publish summary
        run: cat dist/strategy-simulation-50k.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-simulation-50k
          path: |
            dist/strategy-simulation-50k.md
            dist/strategy-simulation-50k.json
          if-no-files-found: error
          retention-days: 30
