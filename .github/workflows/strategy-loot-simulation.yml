name: Universal target Monte Carlo

on:
  push:
    branches: [android-live]
    paths:
      - "tools/simulate_strategy_loot.py"
      - "src/strategies.py"
      - "src/scoring.py"
      - "src/domain.py"
      - "tests/test_universal_targets.py"
      - "tests/test_strategy_loot_simulation.py"
      - "tests/fixtures/strategy_start_equipment.json"
      - ".github/workflows/strategy-loot-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-target-simulation
  cancel-in-progress: true

jobs:
  simulate:
    name: Universal 50k EXP loot target
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared dependencies
        run: python -m pip install "Pillow>=10,<13" "numpy>=1.26,<3" "rich>=13,<15"
      - name: Test generator, production comparer parity and target scoring
        run: |
          python -m unittest discover -s tests -p 'test_strategy_loot_simulation.py' -v
          python -m unittest discover -s tests -p 'test_universal_targets.py' -v
      - name: Simulate 50k EXP drops for Universal only
        run: python -m tools.simulate_strategy_loot --iterations 50000 --seed 20261011 --strategies universal --output dist/universal-target-50k
      - name: Publish summary
        run: cat dist/universal-target-50k.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: universal-target-50k
          path: |
            dist/universal-target-50k.md
            dist/universal-target-50k.json
          if-no-files-found: error
          retention-days: 30
