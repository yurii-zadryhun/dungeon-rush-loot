name: Universal opportunity A/B benchmark

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/universal_opportunity.py"
      - "src/scoring.py"
      - "src/strategies.py"
      - "tools/compare_universal_policy.py"
      - "tools/simulate_strategy_loot.py"
      - "tests/test_universal_opportunity.py"
      - ".github/workflows/compare-universal-policy.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "Pillow>=10,<13" "numpy>=1.26,<3" "rich>=13,<15"
      - name: Test production comparer parity
        run: |
          python -m unittest discover -s tests -p 'test_universal_opportunity.py' -v
          python -m unittest discover -s tests -p 'test_strategy_loot_simulation.py' -v
      - name: Matched stream benchmark
        run: python -m tools.compare_universal_policy --iterations 5000
      - uses: actions/upload-artifact@v4
        with:
          name: universal-opportunity-15k
          path: dist/universal-opportunity-comparison.json
          if-no-files-found: error
