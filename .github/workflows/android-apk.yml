name: Android APK

on:
  push:
    branches: [android-live]
    paths:
      - "androidApp/**"
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 0.1.${{ github.run_number }}-android-live

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Android SDK
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Shared Python tests
        run: python -m unittest discover -s tests -v

      - name: Build signed release APK
        run: gradle --no-daemon :androidApp:assembleRelease

      - name: Verify signature
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$ANDROID_SDK/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk dist/DungeonRushLoot.apk
          sha256sum dist/DungeonRushLoot.apk > dist/DungeonRushLoot.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: DungeonRushLoot-android-live
          path: |
            dist/DungeonRushLoot.apk
            dist/DungeonRushLoot.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling prerelease
        if: github.ref == 'refs/heads/android-live'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-live-latest --cleanup-tag --yes || true
          gh release create android-live-latest             dist/DungeonRushLoot.apk             dist/DungeonRushLoot.apk.sha256             --target "$GITHUB_SHA"             --prerelease             --title "Android live build"             --notes "Signed personal-testing APK built from android-live at $GITHUB_SHA."
