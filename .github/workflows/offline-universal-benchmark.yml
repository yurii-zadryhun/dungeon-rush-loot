name: Offline Universal 50k feasibility

on:
  push:
    branches: [master]
    paths:
      - "tools/offline_universal_benchmark.py"
      - "tests/test_offline_universal_benchmark.py"
      - ".github/workflows/offline-universal-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-universal-feasibility
  cancel-in-progress: true

jobs:
  optimize:
    name: Exact target feasibility + greedy versus offline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python and MILP dependencies
        run: python -m pip install "Pillow>=10,<13" "numpy>=1.26,<3" "rich>=13,<15" "scipy>=1.11,<2"
      - name: Test deterministic pool, exact MILP certificate, and six-item scorer
        run: python -m unittest discover -s tests -p 'test_offline_universal_benchmark.py' -v
      - name: Replay all 50k greedy decisions and solve offline alternatives
        run: python -m tools.offline_universal_benchmark --output dist/offline-universal-50k
      - name: Publish analysis
        run: cat dist/offline-universal-50k.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-universal-50k
          path: |
            dist/offline-universal-50k.md
            dist/offline-universal-50k.json
          if-no-files-found: error
          retention-days: 30
