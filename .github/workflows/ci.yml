name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-common.txt

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Pillow>=10,<13" "numpy>=1.26,<3" "rich>=13,<15" "ruff>=0.8,<1"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile
        run: python -m compileall -q src

      - name: Ruff critical checks
        run: ruff check src tests --select E9,F63,F7,F82

      - name: Shell syntax
        run: bash -n loot_watcher.sh setup.sh
